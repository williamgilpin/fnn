[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnn"
version = "0.2.0"
description = "Embed time series using PyTorch neural networks that penalize false nearest neighbors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
demos = [
    "matplotlib>=3.7",
    "jupyter",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["fnn*"]
